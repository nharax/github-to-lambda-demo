version: 0.2

env:
  variables:
    BUCKET_NAME: iotaas-code-signing-bucket
    SIGNING_PROFILE: aizatronLambdaCodeSigner
    LAMBDA_FUNCTION: github-to-lambda-demo

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies..."
      - mkdir -p package
      - pip install --upgrade pip
      - pip install -r requirements.txt -t package

  build:
    commands:
      - echo "Packaging Lambda function..."
      - cp lambda_function.py package/
      - cd package
      - ZIP_NAME=build-$CODEBUILD_BUILD_NUMBER.zip
      - zip -r $ZIP_NAME .
      - mv $ZIP_NAME ..
      - cd ..
      - echo "Uploading unsigned artifact to S3..."
      - aws s3 cp $ZIP_NAME s3://$BUCKET_NAME/unsigned-code/$ZIP_NAME
      - echo "Sleeping 5 seconds for S3 consistency..."
      - sleep 5

  post_build:
    commands:
      - echo "Starting CodeSigner job..."
      - JOB_ID=$(aws signer start-signing-job \
          --source "{\"s3\":{\"bucketName\":\"$BUCKET_NAME\",\"key\":\"unsigned-code/$ZIP_NAME\"}}" \
          --destination "{\"s3\":{\"bucketName\":\"$BUCKET_NAME\",\"prefix\":\"signed-code/\"}}" \
          --profile-name "$SIGNING_PROFILE" \
          --query 'jobId' \
          --output text)

      - echo "Signing Job ID: $JOB_ID"

      - echo "Waiting for signing to complete..."
      - |
        while true; do
          STATUS=$(aws signer describe-signing-job --job-id $JOB_ID --query 'status' --output text)
          echo "Current status: $STATUS"
          if [ "$STATUS" = "Succeeded" ]; then break; fi
          if [ "$STATUS" = "Failed" ]; then exit 1; fi
          sleep 10
        done

      - echo "Retrieving signed artifact key..."
      - SIGNED_KEY=$(aws signer describe-signing-job \
          --job-id $JOB_ID \
          --query 'signedObject.s3.key' \
          --output text)

      - echo "Deploying signed artifact to Lambda..."
      - aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION \
          --s3-bucket $BUCKET_NAME \
          --s3-key $SIGNED_KEY \
          --publish

artifacts:
  files:
    - build-*.zip
