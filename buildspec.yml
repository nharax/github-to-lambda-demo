version: 0.2

env:
  variables:
    BUCKET_NAME: iotaas-code-signing-bucket
    SIGNING_PROFILE: github_to_lambda_demo_signer
    LAMBDA_FUNCTION: your-lambda-function-name

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt -t .

  build:
    commands:
      - echo "Packaging Lambda..."
      - ZIP_NAME=build-$CODEBUILD_BUILD_NUMBER.zip
      - zip -r $ZIP_NAME .
      - echo "Uploading unsigned artifact to S3..."
      - aws s3 cp $ZIP_NAME s3://$BUCKET_NAME/unsigned-code/$ZIP_NAME

  post_build:
    commands:
      - echo "Checking S3 object..."
      - aws s3 ls s3://$BUCKET_NAME/unsigned-code/$ZIP_NAME

      # Optional: use versioning only if enabled
      - echo "Getting latest S3 object version..."
      - VERSION_ID=$(aws s3api list-object-versions --bucket $BUCKET_NAME --prefix unsigned-code/$ZIP_NAME --query 'Versions[?IsLatest==`true`].VersionId' --output text || echo "")

      - echo "Starting signing job..."
      - JOB_ID=$(aws signer start-signing-job \
          --source "{\"s3\":{\"bucketName\":\"$BUCKET_NAME\",\"key\":\"unsigned-code/$ZIP_NAME\",\"version\":\"$VERSION_ID\"}}" \
          --destination "{\"s3\":{\"bucketName\":\"$BUCKET_NAME\",\"prefix\":\"signed-code/\"}}" \
          --profile-name $SIGNING_PROFILE \
          --query 'jobId' \
          --output text)

      - echo "Waiting for signing job to complete..."
      - |
        while true; do
          STATUS=$(aws signer describe-signing-job --job-id $JOB_ID --query 'status' --output text)
          echo "Status: $STATUS"
          if [ "$STATUS" = "Succeeded" ]; then
            break
          elif [ "$STATUS" = "Failed" ]; then
            echo "Signing failed"
            exit 1
          fi
          sleep 10
        done

      - echo "Getting signed object key..."
      - SIGNED_KEY=$(aws signer describe-signing-job --job-id $JOB_ID --query 'signedObject.s3.key' --output text)

      - echo "Deploying signed Lambda..."
      - aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION \
          --s3-bucket $BUCKET_NAME \
          --s3-key $SIGNED_KEY

      - echo "Deployment complete."
