version: 0.2

env:
  variables:
    BUCKET_NAME: iotaas-code-signing-bucket
    UNSIGNED_PREFIX: unsigned-code
    SIGNED_PREFIX: signed-code
    SIGNING_PROFILE: aizatronLambdaCodeSigner
    LAMBDA_FUNCTION: github-to-lambda-node-demo
    AWS_DEFAULT_REGION: af-south-1
    LAMBDA_SUBFOLDER: lambdas/node-test-lambda

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Changing to Lambda subfolder..."
      - cd $LAMBDA_SUBFOLDER
      - echo "Installing Node.js dependencies..."
      - npm install
      - cd ../../  # return to root

  build:
    commands:
      - echo "Packaging Lambda function..."
      - ZIP_NAME=build-$CODEBUILD_BUILD_NUMBER.zip
      - cd $LAMBDA_SUBFOLDER
      - zip -r ../../$ZIP_NAME .
      - cd ../../
      - echo "Uploading unsigned artifact to S3..."
      - aws s3 cp "$ZIP_NAME" "s3://$BUCKET_NAME/$UNSIGNED_PREFIX/$ZIP_NAME"

  post_build:
    commands:
      - echo "Getting version ID..."
      - VERSION_ID=$(aws s3api list-object-versions --bucket "$BUCKET_NAME" --prefix "$UNSIGNED_PREFIX/$ZIP_NAME" --query 'Versions[?IsLatest==`true`].VersionId' --output text)
      - echo "VERSION_ID=$VERSION_ID"
      - echo "Starting signing job..."
      - JOB_ID=$(aws signer start-signing-job --source "{\"s3\":{\"bucketName\":\"$BUCKET_NAME\",\"key\":\"$UNSIGNED_PREFIX/$ZIP_NAME\",\"version\":\"$VERSION_ID\"}}" --destination "{\"s3\":{\"bucketName\":\"$BUCKET_NAME\",\"prefix\":\"$SIGNED_PREFIX/\"}}" --profile-name "$SIGNING_PROFILE" --query 'jobId' --output text)
      - echo "JOB_ID=$JOB_ID"
      - |
        STATUS="InProgress"
        while [ "$STATUS" != "Succeeded" ]; do
          STATUS=$(aws signer describe-signing-job --job-id $JOB_ID --query 'status' --output text)
          echo "Status: $STATUS"
          if [ "$STATUS" = "Failed" ]; then echo "Signing job failed"; exit 1; fi
          sleep 10
        done
      - echo "Getting signed artifact key..."
      - SIGNED_KEY=$(aws signer describe-signing-job --job-id $JOB_ID --query 'signedObject.s3.key' --output text)
      - echo "SIGNED_KEY=$SIGNED_KEY"
      - echo "Deploying signed Lambda..."
      - aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --s3-bucket "$BUCKET_NAME" --s3-key "$SIGNED_KEY" --publish --region "$AWS_DEFAULT_REGION"

artifacts:
  files:
    - build-*.zip
