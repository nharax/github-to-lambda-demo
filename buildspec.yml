version: 0.2

env:
  variables:
    BUCKET_NAME: my-artifacts-bucket
    LAMBDA_FUNCTION: myLambdaFunction
    SIGNING_PROFILE: mySigningProfile

phases:

  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies"
      - pip install --upgrade pip

  build:
    commands:
      - echo "Zipping Lambda code"
      - zip -r function.zip .

  post_build:
    commands:
      - echo "Uploading to S3"
      - aws s3 cp function.zip s3://$BUCKET_NAME/function.zip
      - echo "Signing code"
      - aws signer start-signing-job --source s3={bucketName=$BUCKET_NAME,key=function.zip} --destination s3={bucketName=$BUCKET_NAME,prefix=signed/} --profile-name $SIGNING_PROFILE
      - echo "Updating Lambda"
      - aws lambda update-function-code --function-name $LAMBDA_FUNCTION --s3-bucket $BUCKET_NAME --s3-key function.zip --publish

artifacts:
  files:
    - function.zip
